name: Copyparty‑Auto‑Sort CI

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint
      run: |
        flake8 . --exit-zero --max-line-length=127

    - name: Smoke test root scripts
      run: |
        for f in *.py; do
          echo "Running $f --help"
          python "$f" --help || true
        done

    - name: Smoke test uploader scripts
      run: |
        for f in uploader/*.py; do
          echo "Running $f --help"
          python "$f" --help || true
        done
